---
apiVersion: flame.org/v1
kind: FlamePool
metadata:
  name: custom-pool-example
  namespace: default
spec:
  scheduling:
    provider: karpenter
    class: gpu
    lifecycle: spot
    architecture: amd64
    priority: high
  podTemplate:
    spec:
      containers:
        - env:
            - name: MY_VAR
              value: "my-value"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /app/.cache/bakeware/
              name: bakeware-cache
      volumes:
        - name: bakeware-cache
          emptyDir: {}
