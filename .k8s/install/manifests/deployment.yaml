---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: flame-controller
  name: flame-controller
  namespace: flame
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: flame-controller
  template:
    metadata:
      labels:
        k8s-app: flame-controller
    spec:
      containers:
        - env:
            - name: MIX_ENV
              value: prod
            - name: BONNY_OPERATOR_NAME
              value: flame-controller
            - name: BONNY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BONNY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BONNY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BONNY_POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  key: cookie
                  name: flame-erlang-cookie
          image: ghcr.io/eigr-labs/flame-k8s-controller:dev-local
          name: flame-controller
          ports:
            - containerPort: 9001
              name: webhooks
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 200m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - mountPath: /app/.cache/bakeware/
              name: bakeware-cache
            - mountPath: /mnt/cert
              name: certs
      initContainers:
        - env:
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  key: cookie
                  name: flame-erlang-cookie
            - name: FLAME_BOOTSTRAP_TLS_ONLY
              value: 'true'
            - name: FLAME_BOOTSTRAP_TLS_SECRET
              value: flame-webhook-tls
          image: ghcr.io/eigr-labs/flame-k8s-controller:dev-local
          name: init-certificates
          volumeMounts:
            - mountPath: /app/.cache/bakeware/
              name: bakeware-cache
      serviceAccountName: flame-controller
      volumes:
        - emptyDir: {}
          name: bakeware-cache
        - name: certs
          secret:
            optional: true
            secretName: flame-webhook-tls
