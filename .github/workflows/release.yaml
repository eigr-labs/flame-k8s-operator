name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test Before Release
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: 27.3
          install-rebar: true
          install-hex: true

      - name: Install dependencies and compile flame_k8s
        run: |
          cd flame_k8s
          mix deps.get
          mix compile
          MIX_ENV=test mix test

      - name: Install dependencies and compile flame_k8s_controller
        run: |
          cd flame_k8s_controller
          mix deps.get
          mix compile
          MIX_ENV=test mix test

      - name: Install dependencies and compile flame_example
        run: |
          cd examples/flame_example
          mix deps.get
          mix compile
          MIX_ENV=test mix test

  publish:
    name: Publish Image And Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: 27.3
          install-rebar: true
          install-hex: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eigr-labs/flame-k8s-controller
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./flame_k8s_controller
          file: ./flame_k8s_controller/Dockerfile-operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set GHCR package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/eigr-labs/packages/container/flame-k8s-controller \
            -f visibility=public

      - name: Generate release manifests for tagged image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          make generate-k8s-manifests version="$VERSION" registry="ghcr.io/eigr-labs"

      - name: Validate generated deployment image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          grep -q "ghcr.io/eigr-labs/flame-k8s-controller:${VERSION}" .k8s/install/manifests/deployment.yaml

      - name: Pack manifests
        run: |
          tar -czf flame-k8s-manifests-${{ github.ref_name }}.tar.gz \
            .k8s/install/manifests \
            scripts/install-operator.sh \
            scripts/ensure-flame-cookie-secret.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            flame-k8s-manifests-${{ github.ref_name }}.tar.gz
            .k8s/install/manifests/*.yaml
            scripts/install-operator.sh
            scripts/ensure-flame-cookie-secret.sh
