name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['27.3']
        elixir: ['1.18.4']

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-rebar: true
          install-hex: true

      - uses: actions/cache@v4
        id: deps-cache
        with:
          path: |
            deps
            flame_k8s/deps
            flame_k8s_controller/deps
            examples/flame_example/deps
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            _build
            flame_k8s/_build
            flame_k8s_controller/_build
            examples/flame_example/_build
          key: ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies and compile flame_k8s
        run: |
          cd flame_k8s
          mix deps.get
          mix compile
          cd ..

      - name: Install dependencies and compile flame_k8s_controller
        run: |
          cd flame_k8s_controller
          mix deps.get
          mix compile
          cd ..

      - name: Install dependencies and compile flame_example
        run: |
          cd examples/flame_example
          mix deps.get
          mix compile
          cd ../..

      - name: Run tests flame_k8s
        run: |
          cd flame_k8s
          MIX_ENV=test mix test
          cd ..

      - name: Run tests flame_k8s_controller
        run: |
          cd flame_k8s_controller
          MIX_ENV=test mix test
          cd ..

      - name: Run tests flame_example
        run: |
          cd examples/flame_example
          MIX_ENV=test mix test
          cd ../..

  docker:
    name: Build and Publish Operator Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eigr-labs/flame-k8s-controller
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./flame_k8s_controller
          file: ./flame_k8s_controller/Dockerfile-operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

